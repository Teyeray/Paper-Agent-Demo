services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: paper-server
    ports:
      - "8001:8001"
    volumes:
      - papers_data:/app/papers
    restart: unless-stopped
    networks:
      - paper-network

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.agent
    container_name: paper-agent
    ports:
      - "8002:8002"
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001
      - DEEPSEEK_API_KEY=
    restart: unless-stopped
    networks:
      - paper-network

volumes:
  papers_data:
    driver: local

networks:
  paper-network:
    driver: bridge
